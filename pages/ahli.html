<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Ahli | E-Potongan Pejabat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: #08233d;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      opacity: .85;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .welcome small {
      color: #6b7280;
    }

    .welcome h2 {
      margin-top: 5px;
      color: #08233d;
      font-size: 20px;
    }

    .profile {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .profile h3 {
      margin-bottom: 15px;
      color: #08233d;
    }

    .row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 11px 0;
      gap: 15px;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #6b7280;
      font-size: 13px;
    }

    .value {
      font-weight: bold;
      text-align: right;
      font-size: 13px;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu button {
      border: none;
      background: white;
      padding: 22px 10px;
      border-radius: 14px;
      font-weight: bold;
      color: #08233d;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
