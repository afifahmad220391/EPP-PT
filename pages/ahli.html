<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Ahli | EPP-PT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f8;
  color: #172033;
}

header {
  background: #082b50;
  color: white;
  padding: 25px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 7px 0 0;
  font-size: 12px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card h2 {
  margin-top: 0;
  color: #082b50;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.row:last-child {
  border-bottom: none;
}

.value {
  font-weight: bold;
  text-align: right;
}

.total {
  background: #082b50;
  color: white;
  padding: 18px;
  border-radius: 12px;
  margin-top: 15px;
  text-align: center;
}

.total small {
  display: block;
  margin-bottom: 5px;
}

.total strong {
  font-size: 30px;
}

.status {
  margin-top: 12px;
  text-align: center;
  font-weight: bold;
}

.loading {
  text-align: center;
  color: #666;
}

.logout {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #c62828;
  color: white;
  font-weight: bold;
  margin-top: 5px;
}
</style>
</head>

<body>

<header>
  <h1>E-POTONGAN PEJABAT</h1>
  <p>CAWANGAN PLATUN TEKNIKAL • BATALION 5 PGA</p>
</header>

<div class="container">

  <div class="card">
    <small>Selamat Datang</small>
    <h2 id="nama">Ahli</h2>

    <div class="row">
      <span>No. PR</span>
      <span class="value" id="pr">-</span>
    </div>

    <div class="row">
      <span>Jawatan</span>
      <span class="value" id="jawatan">-</span>
    </div>

    <div class="row">
      <span>Peranan</span>
      <span class="value" id="role">-</span>
    </div>

    <div class="row">
      <span>No. Telefon</span>
      <span class="value" id="telefon">-</span>
    </div>
  </div>


  <div class="card">

    <h2>Potongan Saya</h2>

    <div id="loading" class="loading">
      Memuatkan rekod potongan...
    </div>

    <div id="potongan" style="display:none;">

      <div class="row">
        <span>Bulan</span>
        <span class="value" id="bulan">-</span>
      </div>

      <div class="row">
        <span>Mess</span>
        <span class="value" id="mess">RM0.00</span>
      </div>

      <div class="row">
        <span>Pejabat</span>
        <span class="value" id="pejabat">RM0.00</span>
      </div>

      <div class="row">
        <span>Perkep</span>
        <span class="value" id="perkep">RM0.00</span>
      </div>

      <div class="row">
        <span>Perumahan</span>
        <span class="value" id="perumahan">RM0.00</span>
      </div>

      <div class="row">
        <span>Khairat</span>
        <span class="value" id="khairat">RM0.00</span>
      </div>

      <div class="total">
        <small>JUMLAH POTONGAN</small>
        <strong id="jumlah">RM0.00</strong>
      </div>

      <div class="status">
        Status: <span id="status">-</span>
      </div>

    </div>

  </div>

  <button class="logout" onclick="logout()">
    LOG KELUAR
  </button>

</div>


<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzOuvnZvar69XHxbw8fivoJX0BrivS-vAbATjt8_MUszr8OegDnQfIyjnyQadyGXD-keg/exec";

const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    window.location.href = "/EPP-PT/";
}

document.getElementById("nama").textContent =
  user.nama || "Ahli";

document.getElementById("pr").textContent =
  user.pr || "-";

document.getElementById("jawatan").textContent =
  user.jawatan || "-";

document.getElementById("role").textContent =
  user.role || "-";

document.getElementById("telefon").textContent =
  user.telefon || "-";


function formatRM(value) {
  return "RM" + Number(value || 0).toFixed(2);
}


fetch(
  API_URL +
  "?action=potongan&pr=" +
  encodeURIComponent(user.pr)
)

.then(response => response.json())

.then(data => {

  document.getElementById("loading").style.display = "none";

  if (data.success) {

    document.getElementById("potongan").style.display = "block";

    document.getElementById("bulan").textContent =
      data.bulan + " " + data.tahun;

    document.getElementById("mess").textContent =
      formatRM(data.mess);

    document.getElementById("pejabat").textContent =
      formatRM(data.pejabat);

    document.getElementById("perkep").textContent =
      formatRM(data.perkep);

    document.getElementById("perumahan").textContent =
      formatRM(data.perumahan);

    document.getElementById("khairat").textContent =
      formatRM(data.khairat);

    document.getElementById("jumlah").textContent =
    formatRM(data.jumlah);

document.getElementById("status").textContent =
    data.status || "-";

localStorage.setItem("potongan", JSON.stringify(data));
localStorage.setItem("potongan_pr", user.pr);

} else {

    document.getElementById("loading").textContent =
      "Tiada rekod potongan dijumpai.";

  }

})

.catch(error => {

  console.error(error);

  document.getElementById("loading").textContent =
    "Gagal memuatkan rekod potongan.";

});


function logout() {
    localStorage.clear();
    window.location.href = "../index.html";
}
    localStorage.clear();
    window.location.replace("/EPP-PT/");
}
    localStorage.removeItem("user");
    localStorage.removeItem("potongan");
    localStorage.removeItem("potongan_pr");

    window.location.href = "/EPP-PT/";
}

</script>

<div style="max-width:600px; margin:0 auto; padding:0 18px 25px;">
  <<button onclick="localStorage.setItem('potongan_pr', JSON.parse(localStorage.getItem('user')).pr); window.location.href='bayaran.html?v=20260726-4';"'"
    style="
      width:100%;
      padding:16px;
      border:none;
      border-radius:12px;
      background:#168c54;
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.12);
    ">
    💳 BAYAR SEKARANG
  </button>
</div>

</body>
</html>
